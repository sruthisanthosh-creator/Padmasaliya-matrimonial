# Netlify deploy config for the Padmasaliya Matrimonial static site.
# Drag this folder onto https://app.netlify.com/drop  — or connect a Git repo.

[build]
  publish = "."
  command = ""

# Serve index.html (the language chooser) at the root.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Nice-to-have: send unknown paths to a friendly 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The stylesheet and script filenames never change, so a long max-age meant a
# phone kept yesterday's CSS for a full day after a deploy — a fix could be
# live on the server and still invisible to the person who reported it.
# must-revalidate makes the browser ask every time; Netlify answers 304 when
# nothing changed, so this stays fast but is never stale.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
